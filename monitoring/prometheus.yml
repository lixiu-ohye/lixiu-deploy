global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'lixiu-monitor'

rule_files:
  - 'alerts.yml'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'lixiu-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:8000']
    labels:
      service: 'backend'
      env: 'production'

  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']
    labels:
      service: 'nginx'
      env: 'production'

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    labels:
      service: 'redis'
      env: 'production'

  - job_name: 'mongodb'
    static_configs:
      - targets: ['mongodb-exporter:9216']
    labels:
      service: 'mongodb'
      env: 'production'

  - job_name: 'celery'
    static_configs:
      - targets: ['celery-exporter:9808']
    labels:
      service: 'celery'
      env: 'production'

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
    labels:
      service: 'node'
      env: 'production'
